<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omasake - JimmySea - Avocean</title>
  <link rel="shortcut icon" href="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png" type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page-body" id="fullpageBody">

  <!-- Full-page Backdrop Overlay -->
  <div class="fullpage-backdrop-overlay"></div>

  <!-- Transparent Full-Width Header -->
  <header class="site-header-translucent">
    <div class="site-header-inner-full">
      
      <!-- NÚT 1 (BÊN TRÁI): LOGO (Bấm vô ra trang home) -->
      <a href="/omakase/" class="brand-logo-link" title="Trang chủ Omasake">
        <img id="brandLogo" src="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png" alt="Omasake Logo" class="brand-logo-img">
        <span class="brand-title-text" id="siteTitleText">Omasake</span>
      </a>

      <!-- CÁC NÚT ĐIỀU HƯỚNG BÊN PHẢI -->
      <div class="nav-buttons-right">
        <!-- NÚT 2: Danh sách truyện (Chuyển sang trang mới /omakase/stories) -->
        <a href="/omakase/stories" class="nav-btn-equal" title="Danh sách truyện">
          <span class="btn-icon">📚</span><span class="btn-text">Danh sách truyện</span>
        </a>

        <!-- NÚT 3: Tổng hợp sự kiện (Gắn link Google Sheet) -->
        <a href="https://docs.google.com/spreadsheets/d/14FWbddNrYmMEpM6UY5gvvDZafLPuivbyylScXsn86-Q/edit?gid=1673879038#gid=1673879038" target="_blank" rel="noopener noreferrer" class="nav-btn-equal" title="Tổng hợp sự kiện">
          <span class="btn-icon">📊</span><span class="btn-text">Tổng hợp sự kiện</span>
        </a>

        <!-- NÚT 4: NÚT BẤM VÔ MOI HIEN THI CHÂN TRANG GÓC CHỮA LÀNH -->
        <button type="button" class="nav-btn-equal btn-scroll-footer" onclick="scrollToFooter()" title="Góc Chữa Lành">
          <span class="btn-icon">🌱</span><span class="btn-text">Góc Chữa Lành</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Fullscreen Banner -->
  <main class="home-banner-fullscreen">
    <!-- CARD PUSHED TO BOTTOM RIGHT CORNER -->
    <div class="banner-content-card">
      <h1 class="banner-h1-title" id="heroTitleText">JimmySea - Avocean</h1>
      <div class="banner-separator-line"></div>
      <h2 class="banner-h2-subtitle" id="heroSubtitleText">Chữa lành cùng gia đình vợ chồng già</h2>
    </div>
  </main>

  <!-- CHÂN TRANG GÓC CHỮA LÀNH (ẨN MẶC ĐỊNH, HIỆN KHI BẤM GÓC CHỮA LÀNH) -->
  <footer class="omasake-custom-footer" id="siteFooter" style="display: none;">
    <div class="container">
      <div class="footer-columns-grid">
        <div class="footer-col-1">
          <h3 class="footer-title-main">JimmySea - Avocean</h3>
          <p class="footer-subtitle-main">Liều thuốc chữa lành tinh thần</p>
          <div class="footer-buttons-group">
            <a href="https://x.com/avocean_GMMTV/status/2050431454098968675?s=20" target="_blank" rel="noopener noreferrer" class="btn-black-pill">
              Vitamin vui vẻ
            </a>
            <a href="https://x.com/Itsjuzm3/status/1958553992734167488?s=20" target="_blank" rel="noopener noreferrer" class="btn-black-pill">
              Thuốc tăng lực
            </a>
          </div>
        </div>

        <div class="footer-col-2">
          <h4 class="footer-list-title">Liều thuốc chữa lành gồm:</h4>
          <a href="https://x.com/jimmyyjp_" target="_blank" rel="noopener noreferrer" class="footer-link-item">Bố già</a>
          <a href="https://x.com/Sea_tawinan" target="_blank" rel="noopener noreferrer" class="footer-link-item">Bé điệu</a>
          <a href="https://x.com/avocean_GMMTV" target="_blank" rel="noopener noreferrer" class="footer-link-item">Người trưởng thành</a>
        </div>
      </div>

      <div class="footer-bottom-centered">
        <a href="https://www.facebook.com/profile.php?id=61577359593140&locale=vi_VN" target="_blank" rel="noopener noreferrer" class="footer-bottom-link">
          Góc nhỏ bên lề của JimmySea na jaaaa
        </a>
      </div>
    </div>
  </footer>

  <!-- Admin Portal Access Badge (Bottom Left Gear Icon) -->
  <a href="/omakase/admin/dashboard" class="admin-gear-btn" title="Bảng quản trị Admin">
    ⚙️
  </a>

  <script>
    function scrollToFooter() {
      const footer = document.getElementById('siteFooter');
      if (footer) {
        const isHidden = footer.style.display === 'none' || getComputedStyle(footer).display === 'none';
        if (isHidden) {
          footer.style.display = 'block';
          footer.scrollIntoView({ behavior: 'smooth' });
        } else {
          footer.style.display = 'none';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/v1/user/settings');
        const json = await res.json();
        if (json.success && json.data) {
          const s = json.data;
          if (s.headerBannerUrl) {
            document.body.style.backgroundImage = `url('${s.headerBannerUrl}')`;
          }
          if (s.logoUrl && document.getElementById('brandLogo')) document.getElementById('brandLogo').src = s.logoUrl;
          if (s.siteTitle && document.getElementById('siteTitleText')) document.getElementById('siteTitleText').textContent = s.siteTitle;
          if (s.heroTitle && document.getElementById('heroTitleText')) document.getElementById('heroTitleText').textContent = s.heroTitle;
          if (s.heroSubtitle && document.getElementById('heroSubtitleText')) document.getElementById('heroSubtitleText').textContent = s.heroSubtitle;
        }
      } catch (e) {}
    }

    function openStoriesModal() {
      document.getElementById('storiesModal').style.display = 'flex';
      fetchStories();
    }

    function closeStoriesModal() {
      document.getElementById('storiesModal').style.display = 'none';
    }

    async function fetchStories() {
      const search = document.getElementById('searchInput').value;
      const genre = document.getElementById('genreSelect').value;
      const grid = document.getElementById('modalStoriesGrid');
      grid.innerHTML = '<p style="color: var(--text-muted);">Đang tải danh sách truyện...</p>';

      try {
        let url = `/api/v1/user/stories?search=${encodeURIComponent(search)}&genre=${encodeURIComponent(genre)}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.success && json.data.length > 0) {
          grid.innerHTML = json.data.map(story => `
            <div class="story-card">
              <a href="/omakase/story/${story._id}">
                <div class="story-cover-wrap">
                  <img src="${story.coverUrl}" alt="${story.title}" class="story-cover-img" loading="lazy" onError="this.src='https://files.cdn-files-a.com/uploads/12065718/2000_69f18eadc4f57.jpg'" />
                  <span class="badge-status">${story.status || 'Đang tiến hành'}</span>
                </div>
              </a>
              <div class="story-info">
                <a href="/omakase/story/${story._id}">
                  <h4 class="story-title">${story.title}</h4>
                </a>
                <div class="story-author">✍️ ${story.author || 'JimmySea - Avocean'}</div>
                <div class="genre-tags">
                  ${(story.genres || []).map(g => `<span class="tag">${g}</span>`).join('')}
                </div>
                <div style="margin-top: auto; border-top: 1px dashed var(--menu-thin-border); padding-top: 8px;">
                  <a href="/omakase/story/${story._id}" class="btn-primary" style="display: block; text-align: center; padding: 6px 12px; font-size: 0.85rem;">
                    📖 Đọc Truyện
                  </a>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: var(--text-muted);">Không tìm thấy truyện phù hợp.</div>';
        }
      } catch (e) {
        grid.innerHTML = '<p style="color: red;">Lỗi tải danh sách truyện.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
    });
  </script>
</body>
</html>
