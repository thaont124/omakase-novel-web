<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chi Tiết Truyện - Omasake</title>
  <link rel="shortcut icon" href="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png"
    type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Site Navigation Header -->
  <header class="site-header-translucent">
    <div class="site-header-inner-full">
      <a href="/omakase/" class="brand-logo-link" title="Trang chủ Omasake">
        <img id="brandLogo" src="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png"
          alt="Omasake Logo" class="brand-logo-img">
        <span class="brand-title-text" id="siteTitleText">OMASAKE</span>
      </a>

      <div class="nav-buttons-right">
        <a href="/omakase/" class="nav-btn-equal" title="Trang chủ">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </span>
          <span class="btn-text">Trang Chủ</span>
        </a>
        <a href="/omakase/stories" class="nav-btn-equal" title="Danh sách chương / truyện">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
          <span class="btn-text">Danh Sách Chương</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 50px;">

    <!-- Breadcrumb -->
    <div style="font-size: 0.95rem; margin-bottom: 20px; color: var(--text-muted);">
      <a href="/omakase/">Home</a> &nbsp;/&nbsp; <span id="breadcrumbTitle"
        style="color: var(--global-main-color); font-weight: 700;">Đang tải...</span>
    </div>

    <!-- Story Header Info Component (2 Columns / Stack on Mobile) -->
    <div id="storyDetailHeader" class="story-detail-component">

      <!-- CỘT 1: Ảnh bìa truyện, Tác giả, Thể loại, Tình trạng -->
      <div class="story-detail-col1">
        <img id="storyCover" src="" alt="Cover"
          style="width: 100%; height: 280px; object-fit: cover; border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.12);"
          onError="this.src='https://files.cdn-files-a.com/uploads/12065718/2000_69f18eadc4f57.jpg'" />

        <div
          style="font-size: 0.9rem; line-height: 1.6; color: var(--text-main); display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            <b>Tác giả:</b> <span id="storyAuthor" style="font-weight: 600; color: #1c5237;">--</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
              <b>Thể loại:</b>
            </div>
            <div id="storyGenres" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;">--</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <b>Tình trạng:</b> <span id="storyStatus"
              style="background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; display: inline-block;">--</span>
          </div>
        </div>
      </div>

      <!-- CỘT 2: Tiêu đề & Văn án -->
      <div class="story-detail-col2">
        <h1 id="storyTitle"
          style="color: var(--global-main-color); font-size: 1.7rem; margin-bottom: 14px; font-weight: 800; line-height: 1.3;">
          Đang tải tên truyện...
        </h1>

        <div
          style="font-size: 1.05rem; font-weight: 700; color: var(--global-main-color); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          VĂN ÁN:
        </div>

        <div id="storyDescription" class="detail-desc"
          style="flex: 1; font-size: 0.95rem; color: #222; line-height: 1.8; background: #fafafa; padding: 18px 20px; border-radius: 12px; border: 1px solid #e0e8e3; white-space: pre-wrap !important; word-break: break-word !important;">
          Nội dung văn án đang được nạp...
        </div>

        <div id="firstChapterBtnWrap" style="margin-top: 16px;">
          <!-- Dynamic First Chapter Read Button -->
        </div>
      </div>

    </div>

    <!-- Chapter List Section -->
    <div class="chapter-list-wrap">
      <h3 class="section-title">Danh Sách Chương (<span id="chapCount">0</span>)</h3>
      <div id="chapterGrid" class="chapter-grid">
        <p style="color: var(--text-muted);">Đang tải danh sách chương...</p>
      </div>
    </div>

  </main>

  <script>
    const storyId = window.location.pathname.split('/story/')[1];

    async function loadSettings() {
      try {
        const res = await fetch('/api/v1/user/settings');
        const json = await res.json();
        if (json.success && json.data) {
          const s = json.data;
          if (s.announcementText && document.getElementById('topAnnouncement')) document.getElementById('topAnnouncement').innerHTML = s.announcementText;
          if (s.logoUrl && document.getElementById('brandLogo')) document.getElementById('brandLogo').src = s.logoUrl;
          if (s.siteTitle) {
            if (document.getElementById('siteTitleText')) document.getElementById('siteTitleText').textContent = s.siteTitle;
          }
        }
      } catch (e) { }
    }

    async function loadStoryDetail() {
      if (!storyId) return;
      try {
        const res = await fetch(`/api/v1/user/stories/${storyId}`);
        const json = await res.json();

        if (json.success && json.data) {
          const s = json.data;
          document.title = `${s.title} - Omasake`;
          document.getElementById('breadcrumbTitle').textContent = s.title;
          document.getElementById('storyTitle').textContent = s.title;
          document.getElementById('storyAuthor').textContent = s.author || 'JimmySea - Avocean';
          document.getElementById('storyStatus').textContent = s.status || 'Đang tiến hành';
          document.getElementById('storyGenres').innerHTML = (s.genres || []).map(g => `<span class="tag">${g}</span>`).join(' ');
          if (document.getElementById('storyViews')) document.getElementById('storyViews').textContent = (s.views || 0).toLocaleString();
          document.getElementById('storyCover').src = s.coverUrl;
          document.getElementById('storyDescription').textContent = s.description || 'Chưa có thông tin tóm tắt.';

          const chapters = s.chapters || [];
          document.getElementById('chapCount').textContent = chapters.length;

          if (chapters.length > 0) {
            document.getElementById('firstChapterBtnWrap').innerHTML = `
              <a href="/omakase/chapter/${chapters[0]._id}" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Đọc Từ Chương 1
              </a>
            `;

            document.getElementById('chapterGrid').innerHTML = chapters.map(c => `
              <a href="/omakase/chapter/${c._id}" class="chapter-item-btn">
                <span>Chương ${c.chapterNumber}: ${c.title}</span>
              </a>
            `).join('');
          } else {
            document.getElementById('chapterGrid').innerHTML = '<p style="color: var(--text-muted);">Truyện chưa có chương nào được phát hành.</p>';
          }
        }
      } catch (e) {
        console.error('Lỗi tải thông tin truyện:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadStoryDetail();
    });
  </script>

  <!-- Admin Portal Access Badge (Bottom Left Gear Icon) -->
  <a href="/omakase/admin/dashboard" class="admin-gear-btn" title="Bảng quản trị Admin">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </a>
</body>

</html>
