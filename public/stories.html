<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Danh Sách Truyện - Omasake</title>
  <link rel="shortcut icon" href="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png"
    type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background-color: #f7f9f8;
    }

    .stories-page-header {
      background: rgba(11, 46, 28, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .page-title-banner {
      background: linear-gradient(135deg, var(--global-main-color), #144d27);
      color: #ffffff;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title-banner h1 {
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      .page-title-banner {
        padding: 24px 14px !important;
      }

      .page-title-banner h1 {
        font-size: 1.25rem !important;
        letter-spacing: 0.5px !important;
      }
    }

    .page-title-banner p {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .filter-bar-card {
      background: #ffffff;
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--menu-thin-border);
      box-shadow: var(--shadow-soft);
      margin-bottom: 30px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
    }

    .filter-bar-card .form-input {
      flex: 2;
      min-width: 250px;
    }

    .filter-bar-card .form-select {
      flex: 1;
      min-width: 200px;
    }
  </style>
</head>

<body>

  <!-- Site Navigation Header -->
  <header class="site-header-translucent stories-page-header">
    <div class="site-header-inner-full">
      <a href="/omakase/" class="brand-logo-link" title="Trang chủ Omasake">
        <img id="brandLogo" src="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png"
          alt="Omasake Logo" class="brand-logo-img">
        <span class="brand-title-text" id="siteTitleText">Omasake</span>
      </a>

      <div class="nav-buttons-right">
        <a href="/omakase/stories" class="nav-btn-equal" title="Danh sách truyện">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" class="line-icon">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </span>
          <span class="btn-text">Danh sách truyện</span>
        </a>

        <a href="https://docs.google.com/spreadsheets/d/14FWbddNrYmMEpM6UY5gvvDZafLPuivbyylScXsn86-Q/edit?gid=1673879038#gid=1673879038"
          target="_blank" rel="noopener noreferrer" class="nav-btn-equal" title="Tổng hợp sự kiện">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" class="line-icon">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span>
          <span class="btn-text">Tổng hợp sự kiện</span>
        </a>

        <button type="button" class="nav-btn-equal btn-scroll-footer" onclick="scrollToFooter()" title="Góc Chữa Lành">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" class="line-icon">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12A10 10 0 0 1 12 2z"></path>
              <path d="M12 18v-6"></path>
              <path d="M12 12c-2-2-4-2-6 0"></path>
              <path d="M12 14c2-2 4-2 6 0"></path>
            </svg>
          </span>
          <span class="btn-text">Góc Chữa Lành</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Header -->
  <div class="page-title-banner">
    <div class="container">
      <h1 style="text-align: center; margin: 0; line-height: 1.35;">
        <span style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="line-icon"
            style="flex-shrink: 0; display: inline-block; vertical-align: middle;">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Danh Sách Truyện</span>
        </span>
      </h1>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="container" style="min-height: 60vh; margin-bottom: 60px;">

    <!-- Filter Search Bar -->
    <div class="filter-bar-card">
      <input type="text" id="searchInput" class="form-input" placeholder="Tìm kiếm tên truyện, tác giả..."
        oninput="fetchStories()" />
    </div>

    <!-- Stories Grid -->
    <div id="storiesGrid" class="story-cards-grid">
      <!-- Dynamic Stories -->
    </div>
  </main>

  <!-- MODAL GÓC CHỮA LÀNH -->
  <div id="healModal" class="modal-overlay" style="display: none;">
    <div class="modal-content-box" style="max-width: 520px; border-radius: 16px;">
      <div class="modal-header" style="background: rgba(186, 242, 227, 0.95);">
        <h3 class="modal-title" style="color: #0b2e1c; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="line-icon">
            <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12A10 10 0 0 1 12 2z"></path>
            <path d="M12 18v-6"></path>
            <path d="M12 12c-2-2-4-2-6 0"></path>
            <path d="M12 14c2-2 4-2 6 0"></path>
          </svg>
          Góc Chữa Lành
        </h3>
        <button class="modal-close-btn" onclick="closeHealModal()">&times;</button>
      </div>
      <div class="modal-body" style="text-align: center; padding: 25px 20px;">
        <h3 style="color: #0b2e1c; font-size: 1.4rem; font-weight: 700; margin-bottom: 4px;">JimmySea - Avocean</h3>
        <p style="color: #1a5e3a; font-size: 0.95rem; margin-bottom: 20px; font-weight: 500;">Liều thuốc chữa lành tinh
          thần 💚</p>

        <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap;">
          <a href="https://x.com/avocean_GMMTV/status/2050431454098968675?s=20" target="_blank"
            rel="noopener noreferrer" class="btn-black-pill">
            Vitamin vui vẻ
          </a>
          <a href="https://x.com/Itsjuzm3/status/1958553992734167488?s=20" target="_blank" rel="noopener noreferrer"
            class="btn-black-pill">
            Thuốc tăng lực
          </a>
        </div>

        <div
          style="border-top: 1px dashed rgba(11, 46, 28, 0.2); padding-top: 16px; display: flex; flex-direction: column; gap: 8px;">
          <h4 style="color: #0b2e1c; font-weight: 700; font-size: 1.05rem;">Liều thuốc chữa lành gồm:</h4>
          <a href="https://x.com/jimmyyjp_" target="_blank" rel="noopener noreferrer"
            style="color: #1a5e3a; text-decoration: underline; font-weight: 600;">Bố già</a>
          <a href="https://x.com/Sea_tawinan" target="_blank" rel="noopener noreferrer"
            style="color: #1a5e3a; text-decoration: underline; font-weight: 600;">Bé điệu</a>
          <a href="https://x.com/avocean_GMMTV" target="_blank" rel="noopener noreferrer"
            style="color: #1a5e3a; text-decoration: underline; font-weight: 600;">Người trưởng thành</a>
        </div>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(11, 46, 28, 0.2);">
          <a href="https://www.facebook.com/profile.php?id=61577359593140&locale=vi_VN" target="_blank"
            rel="noopener noreferrer"
            style="color: #0b2e1c; font-weight: 700; text-decoration: underline; font-size: 1.05rem;">
            Góc nhỏ bên lề của JimmySea na jaaaa
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Portal Link (Bottom Left Gear Icon) -->
  <a href="/omakase/admin/dashboard" class="admin-gear-btn" title="Bảng quản trị Admin">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" class="line-icon">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
      </path>
    </svg>
  </a>

  <script>
    function scrollToFooter() {
      openHealModal();
    }

    function openHealModal() {
      document.getElementById('healModal').style.display = 'flex';
    }

    function closeHealModal() {
      document.getElementById('healModal').style.display = 'none';
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/v1/user/settings');
        const json = await res.json();
        if (json.success && json.data) {
          const s = json.data;
          if (s.logoUrl) document.getElementById('brandLogo').src = s.logoUrl;
          if (s.siteTitle) document.getElementById('siteTitleText').textContent = s.siteTitle;
        }
      } catch (e) { }
    }

    async function fetchStories() {
      const search = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
      const genreEl = document.getElementById('genreSelect');
      const genre = genreEl ? genreEl.value : '';
      const grid = document.getElementById('storiesGrid');
      grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Đang tải danh sách truyện...</p>';

      try {
        let url = `/api/v1/user/stories?search=${encodeURIComponent(search)}&genre=${encodeURIComponent(genre)}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.success && json.data.length > 0) {
          grid.innerHTML = json.data.map(story => `
            <div class="story-card">
              <a href="/omakase/story/${story._id}">
                <div class="story-cover-wrap">
                  <img src="${story.coverUrl}" alt="${story.title}" class="story-cover-img" loading="lazy" onError="this.src='https://files.cdn-files-a.com/uploads/12065718/2000_69f18eadc4f57.jpg'" />
                  <span class="badge-status">${story.status || 'Đang tiến hành'}</span>
                </div>
              </a>
              <div class="story-info">
                <a href="/omakase/story/${story._id}">
                  <h4 class="story-title">${story.title}</h4>
                </a>
                <div class="story-author" style="display: flex; align-items: center; gap: 4px;">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  ${story.author || 'JimmySea - Avocean'}
                </div>
                <div class="genre-tags">
                  ${(story.genres || []).map(g => `<span class="tag">${g}</span>`).join('')}
                </div>
                <div style="margin-top: auto; border-top: 1px dashed var(--menu-thin-border); padding-top: 10px;">
                  <a href="/omakase/story/${story._id}" class="btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; font-size: 0.9rem;">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Đọc Truyện
                  </a>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = '<div style="grid-column: 1/-1; padding: 50px; text-align: center; color: var(--text-muted); font-size: 1.1rem;">Không tìm thấy truyện phù hợp.</div>';
        }
      } catch (e) {
        grid.innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Lỗi tải danh sách truyện.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      fetchStories();
    });
  </script>
</body>

</html>
