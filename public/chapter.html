<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Đọc Chương - Omakase Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header-translucent">
    <div class="site-header-inner-full">
      <a href="/omakase/" class="brand-logo-link" title="Trang chủ Omasake">
        <img id="brandLogo" src="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png" alt="Omasake Logo" class="brand-logo-img">
        <span class="brand-title-text" id="siteTitleText">OMASAKE</span>
      </a>

      <div class="nav-buttons-right">
        <a href="/omakase/" class="nav-btn-equal" title="Trang chủ">
          <span class="btn-text">Trang Chủ</span>
        </a>
        <a id="backToStoryLink" href="/omakase/stories" class="nav-btn-equal" title="Danh sách chương">
          <span class="btn-icon">📚</span><span class="btn-text">Danh Sách Chương</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Reader Container -->
  <main class="container reader-container">
    
    <div class="reader-box" id="readerBox">
      
      <!-- Reader Header -->
      <div class="reader-header" style="text-align: center; margin-bottom: 20px;">
        <div id="readerStoryTitle" class="reader-story-title" style="font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 6px;">Đang tải...</div>
        <h1 id="readerChapTitle" class="reader-chap-title" style="font-size: 2.2rem; font-weight: 800; color: var(--global-main-color);">Đang tải tên chương...</h1>
      </div>

      <!-- Sticky Reader Controls & Customization Bar (Top Navigation Sticky) -->
      <div class="sticky-reader-toolbar">
        <div class="reader-controls">
          <a id="btnPrevChap" href="#" class="btn-nav-chap disabled" title="Chương trước">
            <span class="nav-arrow">←</span><span class="nav-text"> Chương trước</span>
          </a>
          
          <select id="selectChapterNav" onchange="window.location.href='/omakase/chapter/'+this.value" class="form-select">
            <!-- Options populated dynamically -->
          </select>

          <button type="button" id="btnToggleSettings" onclick="toggleReaderSettings(event)" class="btn-nav-chap btn-nav-settings" title="Tùy chỉnh cỡ chữ & màu nền">
            <span class="nav-icon">Aa</span>
          </button>

          <a id="btnNextChap" href="#" class="btn-nav-chap disabled" title="Chương tiếp">
            <span class="nav-text">Chương tiếp </span><span class="nav-arrow">→</span>
          </a>
        </div>

        <!-- Floating Popover for Font Size & Theme Customization -->
        <div class="reader-customize-popover" id="readerSettingsPanel" style="display: none;">
          <div class="popover-row">
            <span class="popover-label">Cỡ chữ:</span>
            <div class="popover-btn-group">
              <button type="button" onclick="changeFontSize(-1)" class="btn-setting-pill">A-</button>
              <button type="button" onclick="changeFontSize(1)" class="btn-setting-pill">A+</button>
            </div>
          </div>

          <div class="popover-row">
            <span class="popover-label">Màu nền:</span>
            <div class="popover-btn-group">
              <button type="button" onclick="setReaderTheme('#f2f8f4', '#193324')" class="btn-theme-circle" style="background: #f2f8f4; border-color: #c3e2cc;" title="Mùa Hạ"></button>
              <button type="button" onclick="setReaderTheme('#ffffff', '#1c1c1c')" class="btn-theme-circle" style="background: #ffffff; border-color: #cccccc;" title="Trắng Sáng"></button>
              <button type="button" onclick="setReaderTheme('#fcf8ed', '#2c251e')" class="btn-theme-circle" style="background: #fcf8ed; border-color: #e2d7be;" title="Giấy Cổ"></button>
              <button type="button" onclick="setReaderTheme('#1b2620', '#d0ebd9')" class="btn-theme-circle" style="background: #1b2620; border-color: #335240;" title="Ban Đêm"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Chapter Text & Embedded Image Links Body -->
      <article id="readerContent" class="reader-content">
        Đang tải nội dung chương...
      </article>

    </div>

  </main>

  <script>
    const chapterId = window.location.pathname.split('/chapter/')[1];
    let currentFontSize = 1.15;

    function toggleReaderSettings(e) {
      if (e) e.stopPropagation();
      const panel = document.getElementById('readerSettingsPanel');
      if (!panel) return;
      const isHidden = panel.style.display === 'none' || !panel.style.display;
      panel.style.display = isHidden ? 'flex' : 'none';
    }

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('readerSettingsPanel');
      const btn = document.getElementById('btnToggleSettings');
      if (panel && panel.style.display !== 'none') {
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.style.display = 'none';
        }
      }
    });

    function changeFontSize(delta) {
      currentFontSize = Math.max(0.95, Math.min(1.6, currentFontSize + (delta * 0.08)));
      document.getElementById('readerContent').style.fontSize = currentFontSize + 'rem';
    }

    function setReaderTheme(bgColor, textColor) {
      const box = document.getElementById('readerBox');
      box.style.backgroundColor = bgColor;
      document.getElementById('readerContent').style.color = textColor;
    }

    function formatChapterHtml(content) {
      if (!content) return '';
      let html = content;

      // Render Markdown images ![alt](url)
      html = html.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
        return `<div class="img-wrapper"><img src="${url.trim()}" alt="${alt || 'Ảnh minh họa'}" class="chapter-img" loading="lazy" /><span class="img-caption">${alt || ''}</span></div>`;
      });

      // Render standalone image URLs
      const lines = html.split('\n');
      return lines.map(line => {
        const trimmed = line.trim();
        if (trimmed.match(/^https?:\/\/.+\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i)) {
          return `<div class="img-wrapper"><img src="${trimmed}" alt="Ảnh minh họa" class="chapter-img" loading="lazy" /></div>`;
        }
        if (trimmed.startsWith('<div class="img-wrapper">')) return trimmed;
        return trimmed ? `<p>${trimmed}</p>` : '';
      }).join('');
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/v1/user/settings');
        const json = await res.json();
        if (json.success && json.data) {
          const s = json.data;
          if (s.announcementText) document.getElementById('topAnnouncement').innerHTML = s.announcementText;
          if (s.headerBannerUrl) document.getElementById('headerBannerImg').src = s.headerBannerUrl;
          if (s.logoUrl) document.getElementById('brandLogo').src = s.logoUrl;
          if (s.siteTitle) document.getElementById('siteTitleText').textContent = s.siteTitle;
        }
      } catch (e) {}
    }

    async function loadChapterContent() {
      if (!chapterId) return;
      try {
        const res = await fetch(`/api/v1/user/chapters/${chapterId}`);
        const json = await res.json();

        if (json.success && json.data) {
          const chap = json.data;
          document.title = `${chap.title} - ${chap.storyTitle}`;
          document.getElementById('readerStoryTitle').textContent = chap.storyTitle || 'Omakase Novel';
          document.getElementById('readerChapTitle').textContent = chap.title;
          
          document.getElementById('readerContent').innerHTML = formatChapterHtml(chap.content);

          const storyUrl = `/omakase/story/${chap.storyId}`;
          document.getElementById('backToStoryLink').href = storyUrl;

          // Populate select dropdown
          const select = document.getElementById('selectChapterNav');
          select.innerHTML = (chap.allChapters || []).map(c => `
            <option value="${c._id}" ${c._id === chap._id ? 'selected' : ''}>
              Chương ${c.chapterNumber}: ${c.title}
            </option>
          `).join('');

          // Prev button
          const btnPrev = document.getElementById('btnPrevChap');
          if (chap.prevChapter) {
            btnPrev.href = `/omakase/chapter/${chap.prevChapter._id}`;
            btnPrev.classList.remove('disabled');
          } else {
            btnPrev.classList.add('disabled');
          }

          // Next button
          const btnNext = document.getElementById('btnNextChap');
          if (chap.nextChapter) {
            btnNext.href = `/omakase/chapter/${chap.nextChapter._id}`;
            btnNext.classList.remove('disabled');
          } else {
            btnNext.classList.add('disabled');
          }
        }
      } catch (e) {
        console.error('Lỗi tải nội dung chương:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadChapterContent();
    });
  </script>

  <!-- Admin Portal Access Badge (Bottom Left Gear Icon) -->
  <a href="/omakase/admin/dashboard" class="admin-gear-btn" title="Bảng quản trị Admin">
    ⚙️
  </a>
</body>
</html>
