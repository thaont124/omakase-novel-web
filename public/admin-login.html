<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Đăng Nhập Admin - Omakase Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page-body" style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Site Navigation Header -->
  <header class="site-header" style="background: linear-gradient(135deg, #1b5e3b 0%, #21783d 100%); padding: 12px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 100%;">
    <div class="container site-header-inner" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto;">
      <div class="brand-area" style="display: flex; align-items: center; gap: 12px;">
        <a href="/omakase/" style="display: flex; align-items: center;">
          <img id="brandLogo" src="https://files.cdn-files-a.com/uploads/12065718/400_69f17ca68bc4f.png" alt="Logo" style="height: 44px !important; width: 44px !important; max-height: 44px !important; max-width: 44px !important; border-radius: 50% !important; object-fit: cover !important; border: 2px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: block;" />
        </a>
        <div>
          <a href="/omakase/" class="brand-title" style="color: #ffffff !important; font-weight: 700; font-size: 1.3rem; text-transform: uppercase; text-decoration: none;">Omasake Admin Portal</a>
        </div>
      </div>
      <nav class="main-nav">
        <a href="/omakase/" class="nav-link" style="background: rgba(255,255,255,0.2); color: #ffffff !important; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; text-decoration: none;">← Quay lại Trang Chủ</a>
      </nav>
    </div>
  </header>

  <main class="container login-main-container">
    <div class="admin-card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-hover);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="color: var(--primary-green); font-size: 1.5rem; font-weight: 800;">🔐 Đăng Nhập Quản Trị</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Dành riêng cho Admin đăng và quản lý truyện</p>
      </div>

      <div id="loginAlert" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập (Admin)</label>
          <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập..." required />
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu..." style="padding-right: 45px;" required />
            <button type="button" onclick="toggleShowPassword('password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 4px; cursor: pointer; color: #555; display: inline-flex; align-items: center; justify-content: center;" title="Hiện mật khẩu">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
          Đăng Nhập Quản Trị
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Omakase Blog Admin System</p>
    </div>
  </footer>

  <script>
    // Tự động cuộn phần tử đang nhập lên vị trí dễ nhìn khi mở bàn phím điện thoại
    document.addEventListener('focusin', function (e) {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
        setTimeout(function () {
          e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
      }
    });

    const EYE_OPEN_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const EYE_OFF_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-icon"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    function toggleShowPassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = EYE_OFF_SVG;
        btn.setAttribute('title', 'Ẩn mật khẩu');
      } else {
        input.type = 'password';
        btn.innerHTML = EYE_OPEN_SVG;
        btn.setAttribute('title', 'Hiện mật khẩu');
      }
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');

      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/v1/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const json = await res.json();

        if (json.success) {
          alertBox.className = 'alert';
          alertBox.style.backgroundColor = '#d4edda';
          alertBox.style.color = '#155724';
          alertBox.style.display = 'block';
          alertBox.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';

          localStorage.setItem('admin_token', json.token);

          setTimeout(() => {
            window.location.href = '/omakase/admin/dashboard';
          }, 800);
        } else {
          alertBox.style.backgroundColor = '#f8d7da';
          alertBox.style.color = '#721c24';
          alertBox.style.display = 'block';
          alertBox.textContent = json.message || 'Đăng nhập thất bại.';
        }
      } catch (err) {
        alertBox.style.backgroundColor = '#f8d7da';
        alertBox.style.color = '#721c24';
        alertBox.style.display = 'block';
        alertBox.textContent = 'Lỗi kết nối máy chủ.';
      }
    });
  </script>
</body>
</html>
